<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fraud Ops Queue</title><link rel="stylesheet" href="/static/style.css"></head><body>
<header><h1>Fraud ops · <span class="org">Demo Wallet</span> (mock)</h1><span>Cases from Saathi, ranked by money at stake × freshness</span></header>
<main>
<div class="card"><h2>Flag a suspicious debit</h2>
<p class="hint">Stands in for the wallet's own fraud-detection system. Saathi calls the customer straight away and asks "was this you?".</p>
<form id="flag" class="row">
<input name="name" placeholder="Customer name" required>
<input name="phone" placeholder="+91 98XXXXXXXX" required>
<input name="amount" placeholder="Amount ₹" inputmode="numeric" required>
<input name="payee" placeholder="Payee UPI ID">
<select name="language"><option value="hi">Hindi</option><option value="en">English</option></select>
<button>Flag &amp; call customer</button></form>
<p id="msg" class="empty"></p></div>
<div class="card" style="overflow-x:auto"><table><thead><tr><th>Since fraud</th><th>Customer</th><th>"Was this you?"</th><th>Total</th><th>RBI window</th><th>Debits</th><th>UTRs</th><th></th></tr></thead><tbody id="q"></tbody></table></div>
</main>
<script>
const key = new URLSearchParams(location.search).get('key');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('/api/config').then(r => r.json()).then(j => document.querySelectorAll('.org').forEach(e => e.textContent = j.org));
const STATUS = {in_call: ['warn live', '● On call'], alert_calling: ['warn live', '● Calling'], submitted: ['ok', 'Case ready'],
  call_ended: ['warn', 'Call ended'], ended_no_reply: ['bad', 'Hung up, no reply'], cleared: ['ok', 'Genuine'], no_answer: ['bad', 'No answer'], call_failed: ['bad', 'Call failed']};
const ANSWER = a => !a ? '<span class="empty">—</span>' : a === 'customer made it' ? '<span class="pill ok">Yes, it was me</span>' : '<span class="pill bad">No, not me</span>';
function since(iso, c) {
  // the clock stops when the case is ready or cleared
  const end = c.submitted_at ? new Date(c.submitted_at) : (c.alert && c.alert.answered_at && c.status === 'cleared') ? new Date(c.alert.answered_at) : new Date();
  const m = Math.max(0, Math.floor((end - new Date(iso)) / 60000));
  const txt = m < 60 ? `${m} min` : m < 2880 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${Math.floor(m / 1440)} days`;
  const cls = c.status === 'cleared' ? 'ok' : m <= 60 ? 'ok' : m <= 24 * 60 ? 'warn' : 'bad';
  return `<span class="pill ${cls} clock">${txt}</span>${c.submitted_at ? '<br><small>to file</small>' : ''}`;
}
async function act(id, a){ await fetch(`/api/cases/${encodeURIComponent(id)}/action`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({action:a})}); load(); }
async function load(){
  const cs = await (await fetch('/api/cases')).json();
  cs.sort((a, b) => (a.status === 'cleared') - (b.status === 'cleared'));
  document.getElementById('q').innerHTML = cs.map(c => { const p = c.priority, bad = c.transactions.filter(t=>t.utr_issue).length, done = (c.bank_actions||[]).map(a=>a[1]), st = STATUS[c.status] || ['', c.status], id = encodeURIComponent(c.id);
    return `<tr><td>${since(p.fraud_at, c)}</td><td><a href="/case/${id}">${esc((c.consent||{}).caller_name || (c.alert||{}).name || c.caller_phone || c.id)}</a><br><span class="pill ${st[0]}">${st[1]}</span></td>
    <td>${c.mode === 'alert' ? ANSWER(c.alert.answer) : '<small>Helpline</small>'}</td>
    <td>₹${p.total_inr.toLocaleString('en-IN')}</td><td>${p.rbi_window?`<span class="pill ${p.working_days<=3?'ok':p.working_days<=7?'warn':'bad'}">${p.rbi_window}</span>`:'—'}</td>
    <td>${c.transactions.length}</td><td>${bad?`<span class="pill bad">${bad} to fix</span>`:'<span class="pill ok">all</span>'}</td>
    <td>${c.status === 'cleared' ? '' : done.includes('dispute') ? '<span class="pill ok">Dispute opened</span>' : `<button onclick='act(${JSON.stringify(c.id)},"dispute")'>Open dispute</button>`}
    <a class="small" href="/api/cases/${id}/audit">Audit log ↓</a></td></tr>`; }).join('') || '<tr><td colspan="8" class="empty">No cases yet</td></tr>';
}
document.getElementById('flag').onsubmit = async e => {
  e.preventDefault();
  const m = document.getElementById('msg'), body = Object.fromEntries(new FormData(e.target));
  if (!key) { m.textContent = 'Open this page as /bank?key=<token> to place calls.'; return; }
  m.textContent = 'Calling the customer…';
  const r = await fetch('/api/alert-call', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({...body, token: key})});
  const j = await r.json().catch(() => ({}));
  m.textContent = r.ok ? 'Saathi is calling the customer now.' : 'Could not start the call: ' + (j.detail || j.bolna_error || r.status);
  load();
};
load(); setInterval(load, 2000);
</script></body></html>
