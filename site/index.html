<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Saathi 1930: a Hindi/English voice agent that calls the customer about a flagged UPI debit and turns a 'no' into a 1930-ready complaint draft for the bank's fraud queue. Bolna Symphony Buildathon demo; all data synthetic." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#EDECE7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0B0B" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;0,800;1,400&family=Tiro+Devanagari+Hindi&display=swap"
      rel="stylesheet"
    />
    <title>Saathi 1930 · the call record</title>
    <script>
      // apply a saved light/dark choice before first paint (see src/theme.ts)
      try {
        var t = localStorage.getItem("saathi-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
