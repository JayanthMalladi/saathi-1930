services:
  - type: web
    name: saathi-1930
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r app/requirements.txt
    startCommand: cd app && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: BACKEND_TOKEN
        generateValue: true
